name: WAIS INVEST Canonical Reconciliation

on:
  workflow_dispatch:
  push:
    paths:
      - canonical-universe.json
      - wais-execution-policy.json
      - scripts/reconcile_public_quote_universe.py
      - .github/workflows/public-canonical-reconciliation.yml
  schedule:
    - cron: "12,42 * * * 1-5"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate sanitised WAIS execution display contract
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('wais-execution-policy.json',encoding='utf-8'))
          expected=['DISCOVERY','RESEARCH','CANDIDATE','CANDIDATE+','READY 1','SUPER A PRE-BREAKOUT','SUPER A ENTRY']
          assert p.get('authority')=='WAIS System → WAIS INVEST display'
          assert p.get('researchFlow')==expected, p.get('researchFlow')
          perms=p.get('stagePermissions',{})
          assert perms['CANDIDATE+']['formalBuyAllowed'] is False
          assert perms['READY 1']['formalBuyAllowed'] is False
          assert perms['SUPER A PRE-BREAKOUT']['formalBuyAllowed'] is False
          assert perms['SUPER A PRE-BREAKOUT']['allowedAction']=='PRE-WARNING'
          assert perms['SUPER A ENTRY']['formalBuyAllowed'] is True
          audit=p.get('mandatoryPreOutputAudit',{})
          assert audit.get('required') is True and audit.get('failClosed') is True
          assert audit.get('failureAction')=='WAIT / DATA GAP'
          assert p.get('principles',{}).get('waisInvestIsDisplayOnly') is True
          print('WAIS INVEST execution display contract: PASS')
          PY
      - name: Generate quote universe from WAIS System mirror and fail closed
        run: python3 scripts/reconcile_public_quote_universe.py
      - name: Validate canonical coverage
        run: |
          python3 - <<'PY'
          import json
          u=json.load(open('canonical-universe.json',encoding='utf-8'))
          p=json.load(open('stock-prices.json',encoding='utf-8'))
          r=p.get('canonicalQuoteUniverse',{})
          assert r.get('status')=='PASS', f"RECONCILIATION FAILED — {r}"
          seen={}
          for stage,names in u.get('stages',{}).items():
              for t in names or []: seen.setdefault(t,[]).append(stage)
          dup={t:s for t,s in seen.items() if len(s)>1}
          assert not dup, f"RECONCILIATION FAILED — duplicate stages: {dup}"
          assert p.get('failedSymbols',[])==[], f"failedSymbols not empty: {p.get('failedSymbols')}"
          assert p.get('relatedRoutesFailedSymbols',[])==[], (
              f"relatedRoutesFailedSymbols not empty: {p.get('relatedRoutesFailedSymbols')}"
          )
          print('WAIS INVEST canonical reconciliation: PASS')
          PY
      - name: Commit public reconciled quote snapshot
        run: |
          if git diff --quiet -- stock-prices.json; then exit 0; fi
          git config user.name "wais-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stock-prices.json
          git commit -m "Reconcile WAIS INVEST canonical quote universe"
          git pull --rebase origin main
          git push origin HEAD:main
