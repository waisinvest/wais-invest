name: WAIS Public Data Auto Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_public_market_data.py"
      - ".github/workflows/public-data-refresh.yml"
  schedule:
    # Every 30 minutes on weekdays. GitHub schedules may start a little late.
    - cron: "*/30 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: wais-public-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public output
        uses: actions/checkout@v4

      - name: Refresh genuine public market snapshots
        run: python3 scripts/update_public_market_data.py

      - name: Validate JSON and safety labels
        run: |
          python3 -m json.tool stock-prices.json >/dev/null
          python3 -m json.tool market-indicators.json >/dev/null
          python3 - <<'PY'
          import json
          for path in ("stock-prices.json", "market-indicators.json"):
              data=json.load(open(path, encoding="utf-8"))
              assert data.get("lastUpdated")
              assert "NOT exchange real-time" in data.get("dataStatus","")
          print("WAIS public data validation: PASS")
          PY

      - name: Commit changed snapshots
        run: |
          if git diff --quiet -- stock-prices.json market-indicators.json; then
            echo "No quote changes"
            exit 0
          fi
          git config user.name "wais-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stock-prices.json market-indicators.json
          git commit -m "Auto refresh public market data"
          git push
