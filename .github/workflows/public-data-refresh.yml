name: WAIS Public Data Auto Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - "canonical-universe.json"
      - "wais-execution-policy.json"
      - "scripts/update_public_market_data.py"
      - ".github/workflows/public-data-refresh.yml"
  schedule:
    # Every 30 minutes on weekdays, offset from the busiest top-of-hour queue.
    - cron: "17,47 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: wais-public-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public output
        uses: actions/checkout@v4

      - name: Refresh genuine public market snapshots
        run: python3 scripts/update_public_market_data.py

      - name: Validate required pages and execution renderer
        run: |
          test -s index.html
          test -s discovery-workbench.html
          test -s fund-dna.html
          test -s policy-structural-catalysts.html
          test -s wais-route-intelligence-v2.js
          test -s wais-super-a-policy-v1.js
          grep -q "wais-route-intelligence-v2.js" market-data.js
          grep -q "wais-super-a-policy-v1.js" market-data.js

      - name: Validate JSON, canonical coverage and safety labels
        run: |
          python3 -m json.tool stock-prices.json >/dev/null
          python3 -m json.tool market-indicators.json >/dev/null
          python3 - <<'PY'
          import json
          for path in ("stock-prices.json", "market-indicators.json"):
              data=json.load(open(path, encoding="utf-8"))
              assert data.get("lastUpdated"), f"{path}: missing lastUpdated"
              assert "NOT exchange real-time" in data.get("dataStatus",""), f"{path}: missing delay disclosure"
              assert data.get("failedSymbols",[])==[], f"{path}: failedSymbols not empty: {data.get('failedSymbols')}"
          stocks=json.load(open("stock-prices.json",encoding="utf-8"))
          assert stocks.get("relatedRoutesFailedSymbols",[])==[], (
              f"relatedRoutesFailedSymbols not empty: {stocks.get('relatedRoutesFailedSymbols')}"
          )
          canonical=stocks.get("canonicalQuoteUniverse",{})
          assert canonical.get("status")=="PASS", f"canonical reconciliation failed: {canonical}"
          assert canonical.get("missing",[])==[], f"canonical quotes missing: {canonical.get('missing')}"
          assert canonical.get("refreshFailures",[])==[], (
              f"canonical refresh failures: {canonical.get('refreshFailures')}"
          )
          print("WAIS public data validation: PASS")
          PY

      - name: Commit changed snapshots
        run: |
          if git diff --quiet -- stock-prices.json market-indicators.json; then
            echo "No quote changes"
            exit 0
          fi
          git config user.name "wais-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stock-prices.json market-indicators.json
          git commit -m "Auto refresh public market data"
          git pull --rebase origin main
          git push origin HEAD:main
