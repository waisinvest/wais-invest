name: Public completed daily close PIT regression
on:
  pull_request:
    paths:
      - 'scripts/update_public_market_data.py'
      - 'scripts/test_public_quote_timezone.py'
      - '.github/workflows/test-public-completed-close.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-completed-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify completed-session baselines without network
        run: python -m unittest discover -s scripts -p 'test_public_quote_timezone.py' -v
      - name: Compile public updater
        run: python -m py_compile scripts/update_public_market_data.py
