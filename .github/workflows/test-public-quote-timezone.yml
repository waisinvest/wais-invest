name: Test public quote exchange-local baselines

on:
  pull_request:
    paths:
      - "scripts/update_public_market_data.py"
      - "scripts/test_public_quote_timezone.py"
      - "scripts/test_public_optional_quote_gap.py"
      - "scripts/audit_public_system.py"
      - ".github/workflows/test-public-quote-timezone.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic offline baseline tests
        run: python -m unittest discover -s scripts -p 'test_public_*.py' -v
