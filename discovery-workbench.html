<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAIS INVEST · Discovery Workbench</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="wais-theme.css"><style>body{background:#08111f;color:#eef4ff;font-family:Inter,"Noto Sans TC",sans-serif;margin:0}.wrap{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.brand{font-weight:800;letter-spacing:.08em}.back{color:#9fb3d1;text-decoration:none;font-weight:600}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}.subnav a{color:#cbd8ea;text-decoration:none;padding:8px 11px;border:1px solid #263650;border-radius:10px;background:#0f1b2d;font-size:12px;font-weight:600}.subnav a.active{color:#fff;border-color:#617aa0;background:#14243b}.kicker{font-size:12px;letter-spacing:.14em;color:#8aa0bf;font-weight:700}.title{font-size:34px;margin:6px 0 0;font-weight:800}.statusbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.pill{padding:8px 12px;border:1px solid #263650;border-radius:999px;background:#0f1b2d;color:#dbe7f7;font-size:12px;font-weight:600}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:#0d1829;border:1px solid #1d2d46;border-radius:18px;padding:18px}.rank{font-size:12px;color:#7f95b3}.ticker{font-size:24px;font-weight:800}.score{font-size:28px;font-weight:800}.muted{color:#93a5bf}.metrics{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}.m{background:#101f34;border-radius:10px;padding:8px;text-align:center}.m b{display:block;font-size:14px}.m span{font-size:9px;color:#8397b4}.thesis{margin-top:14px;font-size:14px;line-height:1.55}.risk{margin-top:8px;color:#d3a7a7;font-size:13px}.price{margin-top:10px;color:#b9cae0;font-size:13px}.badge{font-size:10px;padding:5px 8px;border-radius:999px;border:1px solid #334563;margin-left:8px}@media(max-width:800px){.wrap{padding:20px 16px}.top{align-items:flex-start}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(4,1fr)}.title{font-size:28px}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">WAIS INVEST</div><div class="kicker">DISCOVERY WORKBENCH</div><h1 class="title">Opportunity Ranking</h1></div><a class="back" href="index.html">← Dashboard</a></div><nav class="subnav"><a class="active" href="discovery-workbench.html">Discovery Workbench</a><a href="fund-dna.html">Fund DNA</a><a href="policy-structural-catalysts.html">Policy / Structural Catalysts</a></nav><div class="statusbar"><span class="pill">READY 1 · NONE</span><span class="pill">Model · 25/20/15/15/10/10/5</span><span class="pill" id="stamp">Loading…</span></div><div class="grid" id="grid"></div></div><script>const labels=['Fund','Fund DNA','Stress','Value','Early','Catalyst','Tech'];const keys=['fundamental','fundDNA','stress','valuation','early','catalyst','technical'];async function load(){const [r,p]=await Promise.all([fetch('research-workbench.json').then(x=>x.json()),fetch('stock-prices.json').then(x=>x.json())]);document.getElementById('stamp').textContent='Updated · '+r.lastUpdated.replace('T',' ').slice(0,16);const g=document.getElementById('grid');r.discovery.forEach(x=>{const q=p.prices?.[x.ticker];const px=q?`$${Number(q.price).toFixed(2)} · ${q.session||''} · ${q.asOf?.slice(0,16).replace('T',' ')||''}`:'Price · DATA GAP';const c=document.createElement('article');c.className='card';c.innerHTML=`<div class="rank">#${x.rank}</div><div><span class="ticker">${x.ticker}</span><span class="badge">${x.status}</span></div><div class="score">${x.score}<span class="muted" style="font-size:13px"> /100</span></div><div class="price">${px}</div><div class="metrics">${keys.map((k,i)=>`<div class="m"><b>${x[k]}</b><span>${labels[i]}</span></div>`).join('')}</div><div class="thesis">${x.thesis}</div><div class="risk">Risk · ${x.risk}</div>`;g.appendChild(c)})}load().catch(()=>document.getElementById('stamp').textContent='DATA GAP');</script></body></html>
