<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAIS INVEST · Fund DNA</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="wais-theme.css"><style>body{background:#08111f;color:#eef4ff;font-family:Inter,"Noto Sans TC",sans-serif;margin:0}.wrap{max-width:1120px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:800;letter-spacing:.08em}.kicker{font-size:12px;letter-spacing:.14em;color:#8aa0bf;font-weight:700}.title{font-size:34px;margin:6px 0 16px;font-weight:800}.back{color:#9fb3d1;text-decoration:none;font-weight:600}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}.subnav a{color:#cbd8ea;text-decoration:none;padding:8px 11px;border:1px solid #263650;border-radius:10px;background:#0f1b2d;font-size:12px;font-weight:600}.subnav a.active{color:#fff;border-color:#617aa0;background:#14243b}.panel{background:#0d1829;border:1px solid #1d2d46;border-radius:18px;padding:18px;margin-bottom:16px}.row{display:grid;grid-template-columns:100px 120px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid #182942;align-items:start}.row:last-child{border-bottom:0}.ticker{font-weight:800;font-size:18px}.signal{font-size:11px;border:1px solid #334563;border-radius:999px;padding:5px 8px;width:max-content;font-weight:600}.note{color:#b8c5d8;font-size:14px;line-height:1.55}.stress{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.s{background:#101f34;border-radius:12px;padding:12px}.s b{font-size:18px}.s small{display:block;color:#8fa2bd;margin-top:5px}@media(max-width:720px){.wrap{padding:20px 16px}.top{align-items:flex-start}.row{grid-template-columns:75px 1fr}.note{grid-column:1/-1}.stress{grid-template-columns:repeat(2,1fr)}.title{font-size:28px}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">WAIS INVEST</div><div class="kicker">FUND DNA</div></div><a class="back" href="index.html">← Dashboard</a></div><h1 class="title">Institutional Signal</h1><nav class="subnav"><a href="discovery-workbench.html">Discovery Workbench</a><a class="active" href="fund-dna.html">Fund DNA</a><a href="policy-structural-catalysts.html">Policy / Structural Catalysts</a></nav><section class="panel" id="fund"></section><section class="panel"><div class="kicker">STRESS RESILIENCE · 2026-07-28 → 2026-07-29</div><h2>Forced-Selling Test</h2><div class="stress" id="stress"></div></section></div><script>fetch('research-workbench.json').then(r=>r.json()).then(d=>{const f=document.getElementById('fund');d.fundDNA.forEach(x=>{f.insertAdjacentHTML('beforeend',`<div class="row"><div class="ticker">${x.ticker}</div><div class="signal">${x.signal}</div><div class="note">${x.note}</div></div>`)});const s=document.getElementById('stress');d.stressTest.rows.forEach(x=>s.insertAdjacentHTML('beforeend',`<div class="s"><b>${x.ticker}</b><div>${x.movePct.toFixed(1)}%</div><small>Grade ${x.grade}</small></div>`));s.insertAdjacentHTML('beforeend',`<div class="s"><b>${d.stressTest.benchmark}</b><div>${d.stressTest.benchmarkMovePct.toFixed(1)}%</div><small>Benchmark</small></div>`)})</script></body></html>
